name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verificar backend
        run: ./mvnw -B verify
      - name: Gerar SBOM CycloneDX
        run: ./mvnw -B -DskipTests org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
      - uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            target/site/jacoco/
            target/bom.json
          if-no-files-found: error

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A v0.36.0 fixa a setup-trivy interna por SHA de commit. A v0.28.0 a fixava
      # por tag (v0.2.1), que foi removida do repositorio e levou junto qualquer
      # versao que dependesse dela — quebra irrecuperavel sem subir de versao.
      #
      # Sem o scanner `vuln` de proposito: as dependencias Java sao cobertas com
      # mais fidelidade no scan da imagem abaixo, que le o app.jar que de fato vai
      # para producao, em vez de inferir do pom.xml.
      #
      # TRIVY_OFFLINE_SCAN e obrigatorio, e nao otimizacao: o analisador Java roda
      # no walk de arquivos mesmo sem o scanner `vuln` e tenta resolver a arvore de
      # BOMs do Spring Boot no Maven Central, incluindo POMs que o build nunca
      # baixa. Isso devolve 429 com bloqueio de 30 minutos e derruba o job. A action
      # nao expoe input para isso, so a variavel.
      - name: Analisar segredos e configuração
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_OFFLINE_SCAN: "true"
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Construir imagem
        run: docker build --tag beefit-api:ci .
      - name: Analisar imagem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: beefit-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
