name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verificar backend
        run: ./mvnw -B verify
      - name: Gerar SBOM CycloneDX
        run: ./mvnw -B -DskipTests org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
      - uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            target/site/jacoco/
            target/bom.json
          if-no-files-found: error

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analisar dependências e filesystem
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Construir imagem
        run: docker build --tag beefit-api:ci .
      - name: Analisar imagem
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: beefit-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
