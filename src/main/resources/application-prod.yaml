spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # O blueprint do Render não expõe o host do banco: fromDatabase só oferece
    # user, password e database. Por isso a URL é montada aqui e o host chega
    # como variável definida à mão no dashboard.
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  docker:
    compose:
      enabled: false

server:
  # O proxy de produção deve remover headers Forwarded/X-Forwarded-* recebidos
  # do cliente e escrever os valores confiáveis. A API não deve ficar acessível
  # diretamente, pois HTTPS obrigatório e rate limit por IP dependem disso.
  forward-headers-strategy: framework
  port: ${PORT:8080}

springdoc:
  api-docs:
    enabled: false

beefit:
  beta:
    enabled: ${BEEFIT_BETA_MODE:false}
    allowed-emails: ${BEEFIT_BETA_ALLOWED_EMAILS:}
  registration:
    enabled: ${BEEFIT_REGISTRATION_ENABLED:false}
  legal:
    terms-version: ${BEEFIT_TERMS_VERSION}
    privacy-version: ${BEEFIT_PRIVACY_VERSION}
  security:
    cors:
      allowed-origins: ${BEEFIT_SECURITY_CORS_ALLOWED_ORIGINS}
    token:
      secret: ${JWT_SECRET}

