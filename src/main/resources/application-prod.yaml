spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  docker:
    compose:
      enabled: false

server:
  forward-headers-strategy: framework

springdoc:
  api-docs:
    enabled: false

beefit:
  security:
    cors:
      allowed-origins: ${BEEFIT_SECURITY_CORS_ALLOWED_ORIGINS}
    token:
      secret: ${JWT_SECRET}
