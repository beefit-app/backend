spring:
  application:
    name: beefit-api

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  # Configurações do Hibernate / JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      # Garante que o UUID seja gravado de forma legível no banco de dados
      boot:
        registry:
          selector:
            default_strategy: org.hibernate.id.uuid.UuidGenerator
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1

  # Configurações do Docker Compose do Spring
  docker:
    compose:
      lifecycle-management: start-and-stop
      readiness:
        wait: always

beefit:
  registration:
    enabled: ${BEEFIT_REGISTRATION_ENABLED:true}
  legal:
    terms-version: ${BEEFIT_TERMS_VERSION:2026-08-18}
    privacy-version: ${BEEFIT_PRIVACY_VERSION:2026-08-18}
  business:
    time-zone: ${BEEFIT_BUSINESS_TIME_ZONE:America/Sao_Paulo}
  security:
    cors:
      allowed-origins: ${BEEFIT_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://10.0.2.2:*}
    rate-limit:
      registration-maximum: ${BEEFIT_SECURITY_RATE_LIMIT_REGISTRATION_MAXIMUM:5}
    token:
      secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-none}]"

