spring:
  application:
    name: beefit-api

  # Configurações do Hibernate / JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      # Garante que o UUID seja gravado de forma legível no banco de dados
      boot:
        registry:
          selector:
            default_strategy: org.hibernate.id.uuid.UuidGenerator
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1

  # Configurações do Docker Compose do Spring
  docker:
    compose:
      lifecycle-management: start-and-stop
      readiness:
        wait: always

beefit:
  security:
    cors:
      allowed-origins: ${BEEFIT_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://10.0.2.2:*}
    token:
      secret: ${JWT_SECRET:my_secret_key}

