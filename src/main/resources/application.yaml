spring:
  application:
    name: beefit-api

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  # Configurações do Hibernate / JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      # Garante que o UUID seja gravado de forma legível no banco de dados
      boot:
        registry:
          selector:
            default_strategy: org.hibernate.id.uuid.UuidGenerator
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1

  # Configurações do Docker Compose do Spring
  docker:
    compose:
      lifecycle-management: start-and-stop
      readiness:
        wait: always

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
          microsoft:
            client-id: ${MICROSOFT_CLIENT_ID}
            client-secret: ${MICROSOFT_CLIENT_SECRET}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            provider: microsoft
        # Sem issuer-uri de proposito: o endpoint /common/v2.0 da Microsoft serve contas
        # pessoais e corporativas/escolares, e o claim "iss" do id_token varia por tenant.
        # Configurar issuer-uri forcaria a OIDC discovery a validar um issuer fixo, o que
        # quebraria o login de contas de tenants diferentes do configurado.
        provider:
          microsoft:
            authorization-uri: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/common/oauth2/v2.0/token
            jwk-set-uri: https://login.microsoftonline.com/common/discovery/v2.0/keys
            user-info-uri: https://graph.microsoft.com/oidc/userinfo
            user-name-attribute: sub

beefit:
  beta:
    enabled: ${BEEFIT_BETA_MODE:false}
    allowed-emails: ${BEEFIT_BETA_ALLOWED_EMAILS:}
  registration:
    enabled: ${BEEFIT_REGISTRATION_ENABLED:true}
  legal:
    terms-version: ${BEEFIT_TERMS_VERSION:2026-08-18}
    privacy-version: ${BEEFIT_PRIVACY_VERSION:2026-08-18}
  business:
    time-zone: ${BEEFIT_BUSINESS_TIME_ZONE:America/Sao_Paulo}
  security:
    cors:
      allowed-origins: ${BEEFIT_SECURITY_CORS_ALLOWED_ORIGINS}
    rate-limit:
      registration-maximum: ${BEEFIT_SECURITY_RATE_LIMIT_REGISTRATION_MAXIMUM:5}
    token:
      secret: ${JWT_SECRET}
  oauth2:
    # Para onde o OAuth2LoginSuccessHandler/FailureHandler redirecionam depois do
    # login social, com o código de troca (?code=...) ou erro (?error=...) anexado.
    callback-base-web: ${BEEFIT_OAUTH2_CALLBACK_BASE_WEB:http://localhost:5173/auth/callback}
    callback-base-mobile: ${BEEFIT_OAUTH2_CALLBACK_BASE_MOBILE:com.beefit.app://auth/callback}
# : depois da variável cria um fallback seguro caso ela não seja encontrada no ambiente/CI
cloudflare:
  r2:
    bucket-name: ${BUCKET_NAME:test-bucket}
    account-id: ${ACCOUNT_ID:test-account}
    endpoint: ${ENDPOINT:https://dummy.r2.cloudflarestorage.com}
    access-key-id: ${ACCESS_KEY_ID:dummy-access-key}
    secret-access-key: ${SECRET_ACCESS_KEY:dummy-secret-key}
    token-value: ${TOKEN_VALUE:dummy-token}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-none}]"

