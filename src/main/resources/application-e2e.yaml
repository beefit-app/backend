spring:
  config:
    activate:
      on-profile: e2e
  docker:
    compose:
      file: compose.e2e.yaml
      lifecycle-management: start-and-stop
      readiness:
        wait: always
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

beefit:
  security:
    cors:
      allowed-origins: ${BEEFIT_SECURITY_CORS_ALLOWED_ORIGINS:http://127.0.0.1:4173}
    rate-limit:
      registration-maximum: 10000

springdoc:
  api-docs:
    enabled: false
