services:
  - type: web
    name: beefit-api
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        fromDatabase:
          name: beefit-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: beefit-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: beefit-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: beefit-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: beefit-db
          property: password
      - key: BEEFIT_SECURITY_CORS_ALLOWED_ORIGINS
        value: "*"
      - key: BEEFIT_TERMS_VERSION
        value: 2026-08-18
      - key: BEEFIT_PRIVACY_VERSION
        value: 2026-08-18
      - key: BEEFIT_REGISTRATION_ENABLED
        value: "true"

databases:
  - name: beefit-db
    databaseName: beefit
    user: beefit
    plan: free
