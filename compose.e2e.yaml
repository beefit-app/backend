name: beefit-e2e

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: beefit_e2e
      POSTGRES_USER: beefit_e2e
      POSTGRES_PASSWORD: beefit_e2e
    ports:
      - "127.0.0.1:55434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beefit_e2e -d beefit_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    labels:
      org.springframework.boot.service-connection: postgres
